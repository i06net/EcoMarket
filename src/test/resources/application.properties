# Configuracion de las pruebas automatizadas: base de datos en memoria H2 (modo PostgreSQL),
# sin geocodificacion real ni Gemini, para que las pruebas no dependan de internet.
spring.datasource.url=jdbc:h2:mem:ecomarket-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secreto=ZWNvbWFya2V0LXBydWViYXMtY2xhdmUtc2VjcmV0YS1qd3QtMjAyNg==
jwt.expiracion-minutos=60
admin.correo=admin@ecomarket.pe
admin.contrasena=Admin12345
cors.origenes=http://localhost:4200

geocodificacion.habilitada=false
geocodificacion.url=http://localhost
geocodificacion.agente=EcoMarket-Pruebas

gemini.api-key=
gemini.modelo=gemini-2.5-flash
gemini.url=http://localhost
gemini.tiempo-espera-segundos=2
